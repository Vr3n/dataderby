[project]
name = "dataderby"
version = "0.1.0"
description = "Football competition data pipeline"
authors = [
    { email = "vickyspatel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "dagster>=1.13.26",
    "dagster-webserver>=1.13.26",
    "duckdb>=1.5.6",
    "patchright>=1.63.0",
    "pydantic>=2.14.1",
]

[project.scripts]
dataderby = "dataderby.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["main.py", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network"]
